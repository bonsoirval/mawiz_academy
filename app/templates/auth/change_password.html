{% extends 'base.html' %}{% block title %}Change password — Mawiz Academy{% endblock %}{% block content %}<section class="auth"><div class="auth-card"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change your password</h1><p>Choose a strong password you have not used before.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>Confirm new password<input type="password" name="password_confirmation" minlength="12" required autocomplete="new-password"></label><small>At least 12 characters, including an uppercase letter and a number.</small><button class="button full">Update password</button></form></div></section>{% endblock %}
