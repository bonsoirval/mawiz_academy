{% extends 'base.html' %}{% block title %}Verify sign-in · Mawiz Academy{% endblock %}{% block content %}<section class="auth"><div class="auth-card"><span class="eyebrow">SECURE SIGN-IN</span><h1>Check your email</h1><p>Enter the six-digit verification code sent to your email address.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}"><label>Verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button class="button full">Verify and continue</button></form><p><a href="{{ url_for('auth.login') }}">Start over</a></p></div></section>{% endblock %}
