{% extends 'base.html' %}{% block content %}<section class="page narrow"><span class="eyebrow">ASSIGNMENT</span><h1>{{assignment.title}}</h1><div class="lesson-body">{{assignment.instructions}}</div><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Your response<textarea name="response" rows="10">{{submission.response if submission else ''}}</textarea></label><label>Evidence link <small>Optional</small><input name="evidence_url" value="{{submission.evidence_url if submission else ''}}" placeholder="https://..."></label><button class="button">{{'Resubmit assignment' if submission else 'Submit assignment'}}</button></form></section>{% endblock %}
